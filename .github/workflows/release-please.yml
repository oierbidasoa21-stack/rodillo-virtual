name: Release Please

# On each push to main, keeps an open "release" PR with the next version
# (from the Conventional Commits since the last one) and its CHANGELOG.
# Merging that PR creates the tag and the GitHub release.
# PRs opened with GITHUB_TOKEN do not start CI. If the main ruleset requires
# checks, add a fine-grained token as the RELEASE_PLEASE_TOKEN secret (steps in
# docs/contexto/pendientes/pasos-usuario-fase-13.md); without it, GITHUB_TOKEN is used.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Until the owner enables "Allow GitHub Actions to create and approve pull
    # requests" (Settings → Actions → General; planned after phase 12,
    # decided on 2026-11-28), opening the release PR fails. This keeps main
    # green meanwhile: the failure only shows in the job log. Remove this line
    # once that setting is on.
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a release is created, publish the Docker image to GHCR with its
  # version, an SBOM and provenance attached, and a keyless cosign signature.
  # It lives here because a release made with GITHUB_TOKEN does not start
  # other workflows (an `on: release` workflow would never run).
  image:
    name: Publish image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM (SPDX, made by BuildKit's Syft scanner) and SLSA provenance,
          # stored next to the image in the registry.
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      # Keyless signature with the workflow's OIDC identity: no key to keep.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
