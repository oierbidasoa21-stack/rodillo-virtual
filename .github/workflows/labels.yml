name: Labels

# Creates or updates the labels in .github/labels.json. Never deletes labels,
# so the existing ones (fase-*, enhancement…) stay.
on:
  push:
    branches: [main]
    paths: ['.github/labels.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const wanted = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo,
              per_page: 100,
            });
            const byName = new Map(existing.map((l) => [l.name.toLowerCase(), l]));
            for (const label of wanted) {
              const current = byName.get(label.name.toLowerCase());
              if (!current) {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
                core.info(`Created ${label.name}`);
              } else if (
                current.color !== label.color ||
                (current.description ?? '') !== label.description
              ) {
                await github.rest.issues.updateLabel({ ...context.repo, ...label });
                core.info(`Updated ${label.name}`);
              }
            }
