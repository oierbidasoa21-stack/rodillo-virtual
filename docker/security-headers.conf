# Security headers, included in the server block and in every location: in
# nginx, an add_header inside a location drops the ones inherited from server.
# The Content-Security-Policy line is also the source of the <meta> CSP that
# vite.config.ts puts in index.html for GitHub Pages (which cannot send
# headers); frame-ancestors only works as a header, so the meta leaves it out.
# connect-src also allows the two landscape tile servers (phase 10), and only
# them: src/tiles/sources.ts and a test keep the list and the policy in step.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://elevation-tiles-prod.s3.amazonaws.com https://tiles.maps.eox.at; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "bluetooth=(self), screen-wake-lock=(self), fullscreen=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
