# docker compose up -d   →   http://localhost:8080
services:
  rodillo-virtual:
    build: .
    image: rodillo-virtual
    ports:
      - '8080:8080'
    restart: unless-stopped
    # Hardening: nothing in the container can write outside /tmp, gain
    # privileges or use Linux capabilities. nginx-unprivileged needs none.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
          pids: 64
