<title>Rodillo Pulso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de herramienta (máx. 760px) con pestañas; el player ocupa toda la pantalla, pensado para leerse a 1 m sobre el rodillo */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#16202b; --muted:#5b6977; --line:#d8dee5; --accent:#1f5fd1; --accent-ink:#ffffff;
  --z1:#6b8fb5; --z2:#2b9888; --z3:#c2aa1a; --z4:#e07b1f; --z5:#d6461e; --z6:#ad1650;
  --ok:#22865a; --warn:#c0661a; --bad:#c23030;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --ink:#e7ecf1; --muted:#93a1b0; --line:#2a3643; --accent:#6f9fff; --accent-ink:#0b1220;
  --z1:#84a7ce; --z2:#38b6a4; --z3:#d4bf38; --z4:#f08f37; --z5:#f0623a; --z6:#de3f78;
  --ok:#41b57e; --warn:#e58b3c; --bad:#ec5a5a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --ink:#e7ecf1; --muted:#93a1b0; --line:#2a3643; --accent:#6f9fff; --accent-ink:#0b1220;
  --z1:#84a7ce; --z2:#38b6a4; --z3:#d4bf38; --z4:#f08f37; --z5:#f0623a; --z6:#de3f78;
  --ok:#41b57e; --warn:#e58b3c; --bad:#ec5a5a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-size:34px;line-height:1}
header.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--muted);background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on .dot{background:var(--ok)}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{background:none;border:0;padding:10px 14px;font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

.zonestrip{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:18px}
.zonestrip div{border-radius:6px;padding:6px 4px 5px;text-align:center;color:#fff}
.zonestrip b{display:block;font-family:var(--f-display);font-size:16px;line-height:1}
.zonestrip span{font-size:12px;opacity:.95}
.zt-dark{color:#1b1a10!important}

.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}
.sectionhead h2{font-size:22px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.card .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card h3{font-size:21px;line-height:1.1}
.card .dur{font-family:var(--f-display);font-size:20px;font-weight:600;white-space:nowrap}
.card p{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.profile{position:relative;display:flex;align-items:flex-end;height:46px;gap:1px;border-bottom:1px solid var(--line)}
.profile i{display:block;border-radius:2px 2px 0 0;min-width:1px}
.profile.big{height:78px}
.cursor{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px;transform:translateX(-1px);pointer-events:none}
.shade{position:absolute;left:0;top:0;bottom:0;background:var(--bg);opacity:.55;pointer-events:none}

/* tablas de ajustes / historial */
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
input[type=number],input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{width:64px}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
.field label{min-width:150px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);max-width:65ch}
.msg{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}

/* overlays */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:440px;display:grid;gap:14px;text-align:center}

/* editor */
.ed-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ed-row .durin{display:flex;align-items:center;gap:3px}
.ed-row .durin input{width:52px}
.ed-row .meta{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.ed-row .meta input{flex:1;min-width:110px}
.ed-row .ctl{display:flex;gap:2px}
.ed-row .ctl button{border:0;background:none;padding:4px 7px;border-radius:6px;color:var(--muted)}
.ed-row .ctl button:hover{background:var(--bg)}
.ed-rep{border:1.5px dashed var(--muted);border-radius:10px;padding:8px;display:grid;gap:6px}
.ed-rep .rephead{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.zsel{font-weight:600}
@media (max-width:520px){.ed-row{grid-template-columns:1fr auto}.ed-row .durin{grid-column:1}.ed-row .meta{grid-column:1/-1}}

/* player */
.pl{min-height:100%;display:flex;flex-direction:column;gap:14px}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pl-top h2{font-size:22px}
.pl-total{font-family:var(--f-display);font-size:18px;color:var(--muted)}
.pl-total b{color:var(--ink);font-weight:600}
.zonecard{border-radius:16px;padding:18px 20px 20px;color:#fff;display:grid;gap:4px;transition:background-color .4s}
.zonecard .k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.92}
.zonecard .zn{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,16vw,104px);line-height:.9}
.zonecard .rng{font-family:var(--f-display);font-size:clamp(24px,6vw,34px);font-weight:600}
.zonecard .rpe{font-size:15px;opacity:.95}
.zonecard .bnote{font-size:15px;font-weight:600;margin-top:4px}
.clock{font-family:var(--f-display);font-weight:700;font-size:clamp(84px,26vw,170px);line-height:.85;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock.warn{color:var(--warn)}
.next{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.next .sw{width:14px;height:14px;border-radius:4px;flex:none}
.next .t{display:flex;gap:10px;align-items:center;min-width:0}
.next b{font-family:var(--f-display);font-size:20px}
.hrlive{display:flex;justify-content:center;gap:16px;align-items:baseline;font-family:var(--f-display);font-size:24px}
.hrlive .bpm{font-size:40px;font-weight:700}
.st-ok{color:var(--ok)} .st-hi{color:var(--bad)} .st-lo{color:var(--warn)}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}
.controls .btn{padding:16px 6px;font-size:16px;border-radius:12px}
.controls .wide{grid-column:span 2}
@media (max-width:520px){.controls{grid-template-columns:repeat(2,1fr)}}

/* contador de pulso */
.ring{width:160px;height:160px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:64px;font-weight:700}
.padgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.padgrid button{padding:12px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-display);font-size:22px;font-weight:600}

/* resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.stat .l{font-size:13px;color:var(--muted)}
.zbar{display:grid;grid-template-columns:44px 1fr 92px;gap:10px;align-items:center;padding:6px 0}
.zbar b{font-family:var(--f-display);font-size:18px}
.zbar .track{height:14px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.zbar .fill{height:100%}
.zbar .t{font-size:14px;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1>Rodillo Pulso</h1>
      <p>Sesiones por zonas de pulso, contadas en 10 segundos</p>
    </div>
    <span class="chip" id="hrChip"><span class="dot"></span><span id="hrChipTxt">Sin pulsómetro</span></span>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="lib">Sesiones</button>
    <button role="tab" aria-selected="false" data-tab="hist">Historial</button>
    <button role="tab" aria-selected="false" data-tab="set">Ajustes</button>
  </nav>
  <div id="zoneStrip" class="zonestrip"></div>
  <main id="view"></main>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- datos base ---------- */
const ZDEF = [
  {id:'L1', min:21,max:22, color:'--z1', w:1, met:5.0,  rpe:'Muy suave. Puedes hablar sin problema.'},
  {id:'L2', min:23,max:24, color:'--z2', w:2, met:6.8,  rpe:'Cómodo. Hablas con frases largas.'},
  {id:'L3', min:25,max:26, color:'--z3', w:3, met:8.8,  rpe:'Moderado. Frases cortas.', dark:true},
  {id:'UA', min:27,max:28, color:'--z4', w:4, met:11.0, rpe:'Umbral. Pocas palabras, duro pero sostenible.'},
  {id:'UA+',min:29,max:29, color:'--z5', w:5, met:12.0, rpe:'Por encima del umbral. Hablar cuesta mucho.'},
  {id:'VO2',min:30,max:40, color:'--z6', w:6, met:14.0, rpe:'Máximo. Sin hablar, esfuerzos cortos.'}
];
const KINDS = {warm:'Calentamiento', work:'Serie', rec:'Recuperación', cool:'Vuelta a la calma', steady:'Bloque'};

const B = (min,zone,kind='steady',note='') => ({type:'block', dur:Math.round(min*60), zone, kind, note});
const R = (times,items) => ({type:'repeat', times, items});
const WU = [B(10,'L1','warm'), B(5,'L2','warm','Sube cadencia poco a poco')];

const BUILTIN = [
  {id:'b-fondo', name:'Fondo L2', desc:'Rodaje aeróbico continuo. Base para todo lo demás.',
   blocks:[B(10,'L1','warm'), B(55,'L2','steady','Cadencia 85–95 rpm'), B(5,'L1','cool')]},
  {id:'b-tempo', name:'Tempo 3×12′ L3', desc:'Ritmo sostenido por debajo del umbral, recuperaciones cortas.',
   blocks:[...WU, R(3,[B(12,'L3','work'), B(4,'L1','rec')]), B(8,'L1','cool')]},
  {id:'b-ua3x10', name:'Umbral 3×10′', desc:'Series en UA, el entrenamiento clave para subir el umbral.',
   blocks:[...WU, R(3,[B(10,'UA','work'), B(4,'L1','rec')]), B(10,'L1','cool')]},
  {id:'b-ua2x20', name:'Umbral 2×20′', desc:'Versión larga del umbral. Para cuando 3×10′ ya sale cómodo.',
   blocks:[...WU, R(2,[B(20,'UA','work','Constante, sin picos'), B(5,'L1','rec')]), B(10,'L1','cool')]},
  {id:'b-overunder', name:'Over-unders 3×10′', desc:'Alterna UA y UA+ dentro de la serie: enseña a recuperar bajo carga.',
   blocks:[...WU, R(3,[B(4,'UA','work'), B(1,'UA+','work'), B(4,'UA','work'), B(1,'UA+','work'), B(5,'L1','rec')]), B(8,'L1','cool')]},
  {id:'b-vo2x5', name:'VO2 5×3′', desc:'Esfuerzos cortos al máximo sostenible, recuperación igual a la serie.',
   blocks:[...WU, B(2,'L3','warm','Activación'), B(3,'L1','warm'), R(5,[B(3,'VO2','work'), B(3,'L1','rec')]), B(10,'L1','cool')]},
  {id:'b-3030', name:'30/30 · 2×10', desc:'Diez repeticiones de 30″ fuerte y 30″ suave, dos bloques.',
   blocks:[...WU, R(10,[B(.5,'VO2','work'), B(.5,'L1','rec')]), B(6,'L1','rec'), R(10,[B(.5,'VO2','work'), B(.5,'L1','rec')]), B(10,'L1','cool')]},
  {id:'b-piramide', name:'Pirámide', desc:'Sube de L3 a VO2 y baja, con 2′ suaves entre escalones.',
   blocks:[...WU, B(4,'L3','work'), B(2,'L1','rec'), B(4,'UA','work'), B(2,'L1','rec'), B(3,'UA+','work'), B(2,'L1','rec'), B(2,'VO2','work'), B(2,'L1','rec'), B(3,'UA+','work'), B(2,'L1','rec'), B(4,'UA','work'), B(2,'L1','rec'), B(4,'L3','work'), B(8,'L1','cool')]}
];

/* ---------- almacenamiento local ---------- */
const store = {
  get(k,def){try{const v=localStorage.getItem('rp_'+k);return v?JSON.parse(v):def}catch(e){return def}},
  set(k,v){try{localStorage.setItem('rp_'+k,JSON.stringify(v))}catch(e){}}
};
const settings = Object.assign({weight:80, voice:true, beeps:true, zones:ZDEF.map(z=>({id:z.id,min:z.min,max:z.max}))}, store.get('settings',{}));
let custom = store.get('custom',[]);
let hist = store.get('hist',[]);
const saveSettings=()=>store.set('settings',settings);

function zones(){return ZDEF.map(z=>{const s=settings.zones.find(x=>x.id===z.id)||z;return {...z,min:+s.min,max:+s.max}})}
function zone(id){return zones().find(z=>z.id===id)}
function zcol(id){return `var(${zone(id).color})`}
function rangeTxt(z){return z.id==='VO2'?`${z.min}+ /10″`:(z.min===z.max?`${z.min} /10″`:`${z.min}–${z.max} /10″`)}
function ppmTxt(z){return z.id==='VO2'?`${z.min*6}+ ppm`:(z.min===z.max?`${z.min*6} ppm`:`${z.min*6}–${z.max*6} ppm`)}
function zoneOf10(v){const zs=zones();if(v<zs[0].min)return null;for(const z of zs){if(v<=z.max)return z}return zs[zs.length-1]}
function zstat(v,targetId){const t=zone(targetId);if(v<t.min)return 'lo';if(t.id!=='VO2'&&v>t.max)return 'hi';return 'ok'}

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function fmtMin(sec){const m=Math.round(sec/60);return m>=60?`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}′`:`${m}′`}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

function expand(blocks){
  const out=[];
  for(const b of blocks){
    if(b.type==='repeat'){for(let i=1;i<=b.times;i++){for(const it of b.items){out.push({...it,rep:`${i}/${b.times}`})}}}
    else out.push({...b});
  }
  return out.filter(b=>b.dur>0);
}
const totalDur=flat=>flat.reduce((a,b)=>a+b.dur,0);
function profileHTML(flat,big){
  const zs=zones().map(z=>z.id);
  return `<div class="profile${big?' big':''}">`+flat.map(b=>{const i=zs.indexOf(b.zone);return `<i style="flex:${b.dur} 1 0;height:${22+i*15.6}%;background:${zcol(b.zone)}"></i>`}).join('')+`</div>`;
}

/* ---------- vistas ---------- */
let tab='lib';
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));render()});

function renderStrip(){
  $('#zoneStrip').innerHTML=zones().map(z=>`<div class="${z.dark?'zt-dark':''}" style="background:${zcol(z.id)}"><b>${z.id}</b><span class="num">${z.id==='VO2'?z.min+'+':(z.min===z.max?z.min:z.min+'–'+z.max)}</span></div>`).join('');
}
function render(){
  renderStrip();
  if(tab==='lib')renderLib();else if(tab==='hist')renderHist();else renderSet();
}

function sessionCard(s,isCustom){
  const flat=expand(s.blocks);
  return `<article class="card">
    <div class="row1"><h3>${esc(s.name)}</h3><span class="dur num">${fmtMin(totalDur(flat))}</span></div>
    ${s.desc?`<p>${esc(s.desc)}</p>`:''}
    ${profileHTML(flat)}
    <div class="actions">
      <button class="btn primary" data-act="start" data-id="${s.id}">Empezar</button>
      ${isCustom?`<button class="btn" data-act="edit" data-id="${s.id}">Editar</button><button class="btn ghost danger" data-act="del" data-id="${s.id}">Borrar</button>`
                :`<button class="btn" data-act="dup" data-id="${s.id}">Duplicar y editar</button>`}
    </div></article>`;
}
function findSession(id){return BUILTIN.find(s=>s.id===id)||custom.find(s=>s.id===id)}

function renderLib(){
  $('#view').innerHTML=`
    <div class="sectionhead"><h2>Mis sesiones</h2><button class="btn" id="newBtn">Nueva sesión</button></div>
    <div class="list">${custom.length?custom.map(s=>sessionCard(s,true)).join(''):`<p class="note">Aún no tienes sesiones propias. Crea una nueva o duplica una de la biblioteca para ajustarla.</p>`}</div>
    <div class="sectionhead"><h2>Biblioteca</h2></div>
    <div class="list">${BUILTIN.map(s=>sessionCard(s,false)).join('')}</div>`;
  $('#newBtn').onclick=()=>openEditor({id:null,name:'',desc:'',blocks:[B(10,'L1','warm'),B(20,'L2'),B(5,'L1','cool')]});
  $('#view').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const s=findSession(b.dataset.id);
    if(b.dataset.act==='start')startPlayer(s);
    if(b.dataset.act==='edit')openEditor(JSON.parse(JSON.stringify(s)));
    if(b.dataset.act==='dup')openEditor({...JSON.parse(JSON.stringify(s)),id:null,name:s.name+' (mía)'});
    if(b.dataset.act==='del'){
      if(b.dataset.armed){custom=custom.filter(x=>x.id!==s.id);store.set('custom',custom);toast('Sesión borrada');renderLib()}
      else{b.dataset.armed='1';b.textContent='¿Seguro? Pulsa otra vez';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Borrar'}},3000)}
    }
  });
}

function renderHist(){
  if(!hist.length){$('#view').innerHTML=`<div class="sectionhead"><h2>Historial</h2></div><p class="note">Aquí aparecerá cada sesión que termines, con su duración, carga y kcal estimadas. El historial se guarda solo en este navegador.</p>`;return}
  const wk=hist.filter(h=>Date.now()-h.date<7*864e5);

/* ---------- editor ---------- */
let ed=null;
function openEditor(s){
  // convertir duraciones a min/seg para edición

}
function blockRow(b,path){
  const m=Math.floor(b.dur/60),sec=b.dur%60;

    <span class="meta"><select id="k-${path}" data-p="${path}" data-f="kind">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${k===b.kind?'selected':''}>${v}</option>`).join('')}</select>
      <input type="text" id="n-${path}" data-p="${path}" data-f="note" placeholder="Nota (opcional)" value="${esc(b.note||'')}"></span>
    <span class="ctl"><button data-mv="-1" data-p="${path}" aria-label="Subir">↑</button><button data-mv="1" data-p="${path}" aria-label="Bajar">↓</button><button data-rm data-p="${path}" aria-label="Quitar">✕</button></span>
  </div>`;
}
function renderEditor(){
  const flat=expand(ed.blocks);
  $('#overlay').innerHTML=`<div class="sheet">
    <div class="pl-top"><h2>${ed.id?'Editar sesión':'Nueva sesión'}</h2><button class="btn ghost" id="edClose">Cancelar</button></div>
    <div class="card" style="margin-top:12px">
      <div class="field"><label for="edName">Nombre</label><input type="text" id="edName" style="flex:1" value="${esc(ed.name)}" placeholder="Por ejemplo, Umbral 4×8′"></div>
      <div class="field"><label for="edDesc">Descripción</label><input type="text" id="edDesc" style="flex:1" value="${esc(ed.desc||'')}" placeholder="Opcional"></div>
      <div class="row1" style="display:flex;justify-content:space-between"><span class="tag">Perfil</span><span class="dur num" style="font-family:var(--f-display);font-size:20px;font-weight:600">${fmtMin(totalDur(flat))}</span></div>
      ${profileHTML(flat)}
    </div>
    <div class="list" style="margin-top:12px">
      ${ed.blocks.map((b,i)=>b.type==='repeat'
        ?`<div class="ed-rep"><div class="rephead"><span><b style="font-family:var(--f-display);font-size:18px">Repetir</b>
            <input type="number" min="1" id="t-${i}" data-p="${i}" data-f="times" value="${b.times}" aria-label="Veces"> veces</span>
            <span class="ctl ed-row" style="border:0;padding:0;background:none;display:flex"><button data-mv="-1" data-p="${i}" aria-label="Subir">↑</button><button data-mv="1" data-p="${i}" aria-label="Bajar">↓</button><button data-rm data-p="${i}" aria-label="Quitar">✕</button></span></div>
            ${b.items.map((it,j)=>blockRow(it,`${i}.${j}`)).join('')}
            <div><button class="btn ghost" data-addin="${i}">Añadir bloque a la repetición</button></div></div>`
        :blockRow(b,`${i}`)).join('')}
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="btn" id="addB">Añadir bloque</button>
      <button class="btn" id="addR">Añadir repetición</button>

    <div class="actions" style="margin-top:20px"><button class="btn primary" id="edSave">Guardar sesión</button></div>
    <div id="edErr" class="msg" style="margin-top:10px" hidden></div>
  </div>`;
  const get=p=>{const [i,j]=p.split('.').map(Number);return j===undefined?{arr:ed.blocks,idx:i}:{arr:ed.blocks[i].items,idx:j}};
  $('#overlay').querySelectorAll('[data-f]').forEach(inp=>inp.onchange=()=>{
    const {arr,idx}=get(inp.dataset.p);const b=arr[idx];const f=inp.dataset.f;
    if(f==='m')b.dur=Math.max(0,+inp.value||0)*60+b.dur%60;
    else if(f==='s')b.dur=Math.floor(b.dur/60)*60+Math.min(59,Math.max(0,+inp.value||0));
    else if(f==='times')b.times=Math.max(1,Math.round(+inp.value||1));
    else b[f]=inp.value;
    if(['m','s','times','zone'].includes(f))renderEditor();
  });
  $('#overlay').querySelectorAll('[data-mv]').forEach(btn=>btn.onclick=()=>{const {arr,idx}=get(btn.dataset.p);const n=idx+(+btn.dataset.mv);if(n<0||n>=arr.length)return;[arr[idx],arr[n]]=[arr[n],arr[idx]];renderEditor()});
  $('#overlay').querySelectorAll('[data-rm]').forEach(btn=>btn.onclick=()=>{const {arr,idx}=get(btn.dataset.p);arr.splice(idx,1);renderEditor()});
  $('#overlay').querySelectorAll('[data-addin]').forEach(btn=>btn.onclick=()=>{ed.blocks[+btn.dataset.addin].items.push(B(2,'L1','rec'));renderEditor()});
  $('#edName').oninput=e=>ed.name=e.target.value;
  $('#edDesc').oninput=e=>ed.desc=e.target.value;
  $('#addB').onclick=()=>{ed.blocks.push(B(5,'L2'));renderEditor()};
  $('#addR').onclick=()=>{ed.blocks.push(R(3,[B(4,'UA','work'),B(2,'L1','rec')]));renderEditor()};
  $('#edClose').onclick=closeOverlay;
  $('#edSave').onclick=()=>{
    const err=$('#edErr');
    if(!ed.name.trim()){err.hidden=false;err.textContent='Ponle un nombre a la sesión para poder guardarla.';return}
    if(totalDur(expand(ed.blocks))<60){err.hidden=false;err.textContent='La sesión tiene que durar al menos 1 minuto. Revisa las duraciones de los bloques.';return}
    if(ed.id){custom=custom.map(s=>s.id===ed.id?ed:s)}else{ed.id='c-'+Date.now();custom.push(ed)}
    store.set('custom',custom);closeOverlay();tab='lib';render();toast('Sesión guardada');
  };
}
function closeOverlay(){$('#overlay').hidden=true;$('#overlay').innerHTML='';}

/* ---------- audio y voz ---------- */
let actx=null;
function beep(freq=880,ms=140,when=0){
  if(!settings.beeps||!actx)return;
  const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=freq;
  const t=actx.currentTime+when;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+ms/1000+0.02);
}
function say(t){
  if(!settings.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}
}
const spokenZone=id=>({'L1':'L uno','L2':'L dos','L3':'L tres','UA':'umbral','UA+':'umbral más','VO2':'VO dos'}[id]);

/* ---------- pulsómetro Bluetooth (Heart Rate Service 0x180D) ---------- */
const hr={dev:null,bpm:null,last:0};let hrMsg='';
async function connectHR(){
  if(!navigator.bluetooth){hrMsg='Este navegador o esta vista no permite Bluetooth. Abre la página como archivo en Chrome (Android u ordenador).';renderSet();return}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});
    const srv=await dev.gatt.connect();const svc=await srv.getPrimaryService('heart_rate');
    const ch=await svc.getCharacteristic('heart_rate_measurement');await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>{const v=e.target.value;const f=v.getUint8(0);hr.bpm=(f&1)?v.getUint16(1,true):v.getUint8(1);hr.last=Date.now();updateHRUI()});
    dev.addEventListener('gattserverdisconnected',()=>{hr.dev=null;hr.bpm=null;updateChip();toast('Pulsómetro desconectado')});
    hr.dev=dev;hrMsg=`Conectado: ${dev.name||'pulsómetro'}`;updateChip();
  }catch(e){hrMsg=(e&&e.name==='NotFoundError')?'No se eligió ningún dispositivo.':'No se pudo conectar. Comprueba que el pulsómetro está emitiendo y que esta vista permite Bluetooth.'}
  if(tab==='set')renderSet();
}
function disconnectHR(){try{hr.dev&&hr.dev.gatt.disconnect()}catch(e){}hr.dev=null;hr.bpm=null;hrMsg='';updateChip();renderSet()}
const hrFresh=()=>hr.bpm&&Date.now()-hr.last<5000;
function updateChip(){$('#hrChip').classList.toggle('on',!!hr.dev);$('#hrChipTxt').textContent=hr.dev?(hrFresh()?`${hr.bpm} ppm`:'Pulsómetro conectado'):'Sin pulsómetro'}
function updateHRUI(){updateChip();if(P&&!P.done)drawPlayerHR()}

/* ---------- player ---------- */
let P=null,wake=null;
async function getWake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P&&!P.done)getWake()});

function startPlayer(s){
  P={s,flat:expand(s.blocks),idx:0,bEl:0,running:false,actual:[],counts:[],hrSamples:[],announced:false,lastBeep:null,done:false,last:0,endArmed:false};
  P.actual=P.flat.map(()=>0);
  $('#overlay').hidden=false;
  $('#overlay').innerHTML=`<div class="sheet pl">
    <div class="pl-top"><h2>${esc(s.name)}</h2><span class="pl-total num" id="plTot"></span></div>
    <div id="plProf" style="position:relative"></div>
    <div class="zonecard" id="plZone"></div>
    <div class="clock num" id="plClock">0:00</div>
    <div id="plHR" class="hrlive" hidden></div>
    <div class="next" id="plNext"></div>
    <div class="controls">
      <button class="btn primary wide" id="cPlay">Empezar</button>
      <button class="btn wide" id="cCount">Contar pulso</button>
      <button class="btn" id="cAdd">+1′</button>
      <button class="btn" id="cSkip">Saltar</button>
      <button class="btn danger wide" id="cEnd">Terminar</button>
    </div>
  </div>`;
  $('#plProf').innerHTML=profileHTML(P.flat,true)+`<div class="shade" id="plShade"></div><div class="cursor" id="plCur"></div>`;
  $('#cPlay').onclick=togglePlay;
  $('#cCount').onclick=openCounter;
  $('#cAdd').onclick=()=>{P.flat[P.idx].dur+=60;P.announced=false;rebuildProfile();drawPlayer();toast('Bloque alargado 1 minuto')};
  $('#cSkip').onclick=()=>{nextBlock(true)};
  $('#cEnd').onclick=e=>{const b=e.currentTarget;if(P.endArmed){finish()}else{P.endArmed=true;b.textContent='¿Terminar? Pulsa otra vez';setTimeout(()=>{if(P&&!P.done){P.endArmed=false;b.textContent='Terminar'}},3000)}};
  drawPlayer();
  P.timer=setInterval(tick,200);
}
function rebuildProfile(){$('#plProf').innerHTML=profileHTML(P.flat,true)+`<div class="shade" id="plShade"></div><div class="cursor" id="plCur"></div>`}
function togglePlay(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
  P.running=!P.running;P.last=performance.now();
  if(P.running){getWake();if(P.bEl===0&&P.idx===0){beep(660,120);beep(990,220,.15);announceCurrent()}}
  else{try{wake&&wake.release()}catch(e){}}
  drawPlayer();
}
function announceCurrent(){const b=P.flat[P.idx];say(`${KINDS[b.kind]}, ${spokenZone(b.zone)}, ${Math.round(b.dur/60)||b.dur} ${b.dur>=60?'minutos':'segundos'}`)}
function tick(){
  if(!P||P.done)return;
  const now=performance.now();
  if(P.running){
    const dt=(now-P.last)/1000;P.bEl+=dt;P.actual[P.idx]+=dt;
    // muestra de pulso cada segundo
    P.secAcc=(P.secAcc||0)+dt;
    while(P.secAcc>=1){P.secAcc-=1;if(hrFresh())P.hrSamples.push(hr.bpm)}
    const b=P.flat[P.idx],rem=b.dur-P.bEl,nb=P.flat[P.idx+1];
    if(rem<=10.05&&!P.announced&&b.dur>15){P.announced=true;beep(740,160);
      say(nb?`En diez segundos: ${KINDS[nb.kind].toLowerCase()}, ${spokenZone(nb.zone)}`:'Diez segundos para terminar')}
    const rs=Math.ceil(rem);
    if(rs<=3&&rs>=1&&P.lastBeep!==rs){P.lastBeep=rs;beep(880,110)}
    if(rem<=0){nextBlock(false)}
  }
  P.last=now;drawPlayer();
}
function nextBlock(manual){
  if(P.idx>=P.flat.length-1){finish();return}
  P.idx++;P.bEl=0;P.announced=false;P.lastBeep=null;
  beep(1175,260);
  if(manual){announceCurrent();rebuildProfile()}
  drawPlayer();
}
function drawPlayer(){
  const b=P.flat[P.idx],z=zone(b.zone),nb=P.flat[P.idx+1];
  const tot=totalDur(P.flat),done=P.flat.slice(0,P.idx).reduce((a,x)=>a+x.dur,0)+Math.min(P.bEl,b.dur);
  const rem=b.dur-P.bEl;
  $('#plTot').innerHTML=`Bloque ${P.idx+1}/${P.flat.length} · Quedan <b>${fmt(tot-done)}</b>`;
  const share=done/tot*100;$('#plCur').style.left=share+'%';$('#plShade').style.width=share+'%';
  const zc=$('#plZone');zc.style.background=zcol(b.zone);zc.classList.toggle('zt-dark',!!z.dark);
  zc.innerHTML=`<span class="k">${KINDS[b.kind]}${b.rep?` · ${b.rep}`:''}</span><span class="zn">${z.id}</span><span class="rng num">${rangeTxt(z)} · ${ppmTxt(z)}</span><span class="rpe">${z.rpe}</span>${b.note?`<span class="bnote">${esc(b.note)}</span>`:''}`;
  const cl=$('#plClock');cl.textContent=fmt(Math.ceil(rem));cl.classList.toggle('warn',P.running&&rem<=10);
  $('#plNext').innerHTML=nb?`<span class="t"><span class="sw" style="background:${zcol(nb.zone)}"></span><span><span class="tag">Siguiente</span><br><b>${nb.zone}</b> · ${KINDS[nb.kind]}</span></span><span class="num" style="font-family:var(--f-display);font-size:22px;font-weight:600">${fmt(nb.dur)}</span>`
    :`<span class="t"><span><span class="tag">Siguiente</span><br><b>Fin de la sesión</b></span></span>`;
  $('#cPlay').textContent=P.running?'Pausa':(P.bEl>0||P.idx>0?'Reanudar':'Empezar');
  drawPlayerHR();
}
function drawPlayerHR(){
  const el=$('#plHR');if(!el)return;
  if(!hrFresh()){el.hidden=true;return}
  const v10=hr.bpm/6,st=zstat(Math.round(v10),P.flat[P.idx].zone);
  el.hidden=false;el.innerHTML=`<span class="bpm num st-${st}">${hr.bpm}</span><span class="num">ppm · ${v10.toFixed(1)} /10″</span><span class="st-${st}">${st==='ok'?'En zona':st==='hi'?'Por encima':'Por debajo'}</span>`;
}

/* ---------- contador de pulso 10″ ---------- */
function openCounter(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
  const target=P.flat[P.idx].zone;const m=$('#modal');m.hidden=false;

    <h3 style="font-size:24px">Contar pulso</h3>
    <p class="note" style="margin:0 auto" id="cTxt">Busca el pulso. Al pitido empieza a contar; al doble pitido para.</p>
    <div class="ring"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="cArc" cx="80" cy="80" r="70" fill="none" stroke="${zcol(target)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="c num" id="cNum">10</div></div>
    <div id="cPad" hidden><p class="tag" style="margin:0 0 8px">¿Cuántas pulsaciones has contado?</p><div class="padgrid">${Array.from({length:18},(_,i)=>i+18).map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div></div>
    <div id="cRes" hidden></div>
    <div class="actions" style="justify-content:center"><button class="btn primary" id="cGo">Empezar</button><button class="btn ghost" id="cX">Cerrar</button></div>
  </div>`;
  const close=()=>{clearInterval(m.t);m.hidden=true;m.innerHTML=''};
  $('#cX').onclick=close;
  $('#cGo').onclick=()=>{
    $('#cGo').hidden=true;let pre=3;$('#cNum').textContent=pre;$('#cTxt').textContent='Preparado…';beep(600,90);
    m.t=setInterval(()=>{pre--;if(pre>0){$('#cNum').textContent=pre;beep(600,90);return}
      clearInterval(m.t);beep(1000,300);$('#cTxt').textContent='Cuenta ahora';const t0=performance.now();
      m.t=setInterval(()=>{const el=(performance.now()-t0)/1000;$('#cNum').textContent=Math.max(0,Math.ceil(10-el));$('#cArc').style.strokeDashoffset=C*(1-Math.min(1,el/10));
        if(el>=10){clearInterval(m.t);beep(1000,150);beep(1000,150,.22);$('#cTxt').textContent='Para de contar';$('#cPad').hidden=false;$('.ring').hidden=true}},100);
    },1000);
  };
  m.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.n,cur=P.flat[P.idx].zone,st=zstat(v,cur),zz=zoneOf10(v);
    P.counts.push({t:P.flat.slice(0,P.idx).reduce((a,x)=>a+x.dur,0)+P.bEl,v,target:cur,st});
    $('#cPad').hidden=true;$('#cTxt').hidden=true;
    $('#cRes').hidden=false;$('#cRes').innerHTML=`<div class="clock num st-${st}" style="font-size:72px">${v}</div><p style="margin:0;font-size:18px;font-weight:600" class="st-${st}">${st==='ok'?'En zona':st==='hi'?'Por encima de':'Por debajo de'} ${cur}</p><p class="note" style="margin:4px auto 0">${v*6} ppm · ${zz?'zona '+zz.id:'por debajo de L1'}</p>`;
    setTimeout(close,2600);
  });
}

/* ---------- resumen ---------- */
function finish(){
  clearInterval(P.timer);P.done=true;P.running=false;try{wake&&wake.release()}catch(e){}
  beep(880,150);beep(1175,150,.18);beep(1568,300,.36);say('Sesión terminada');
  const zs=zones(),plan={},real={};zs.forEach(z=>{plan[z.id]=0;real[z.id]=0});
  P.flat.forEach((b,i)=>{plan[b.zone]+=b.dur;real[b.zone]+=P.actual[i]});
  const measured=P.hrSamples.length>=60;const meas={};zs.forEach(z=>meas[z.id]=0);let below=0;
  if(measured)P.hrSamples.forEach(bpm=>{const z=zoneOf10(Math.round(bpm/6));if(z)meas[z.id]+=1;else below+=1});
  const use=measured?meas:real;
  const dur=P.actual.reduce((a,x)=>a+x,0);
  const load=zs.reduce((a,z)=>a+use[z.id]/60*z.w,0)+(measured?below/60*0.5:0);
  const kcal=zs.reduce((a,z)=>a+z.met*settings.weight*use[z.id]/3600,0)+(measured?3.5*settings.weight*below/3600:0);
  if(dur>=60){hist.push({date:Date.now(),name:P.s.name,dur,load,kcal});store.set('hist',hist)}
  const maxv=Math.max(1,...zs.map(z=>Math.max(plan[z.id],use[z.id])));
  const okN=P.counts.filter(c=>c.st==='ok').length;
  $('#overlay').innerHTML=`<div class="sheet">
    <div class="pl-top"><h2>${esc(P.s.name)} · Resumen</h2><button class="btn primary" id="sClose">Volver a sesiones</button></div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><div class="v num">${fmt(dur)}</div><div class="l">Tiempo de sesión</div></div>
      <div class="stat"><div class="v num">${Math.round(load)}</div><div class="l">Carga (TRIMP por zonas)</div></div>
      <div class="stat"><div class="v num">${Math.round(kcal)}</div><div class="l">kcal estimadas (±20 %)</div></div>
      ${P.counts.length?`<div class="stat"><div class="v num">${okN}/${P.counts.length}</div><div class="l">Conteos en zona</div></div>`:''}
    </div>
    <div class="sectionhead"><h2>Tiempo en cada zona</h2><span class="tag">${measured?'Medido por pulsómetro':'Según los bloques realizados'}</span></div>
    <div class="card">
      ${zs.map(z=>`<div class="zbar"><b style="color:${zcol(z.id)}">${z.id}</b>
        <div style="display:grid;gap:3px"><div class="track"><div class="fill" style="width:${use[z.id]/maxv*100}%;background:${zcol(z.id)}"></div></div>
        <div class="track" style="height:5px;border:0"><div class="fill" style="width:${plan[z.id]/maxv*100}%;background:var(--muted);opacity:.5"></div></div></div>
        <span class="t num">${fmt(use[z.id])} <span class="note">/ ${fmt(plan[z.id])}</span></span></div>`).join('')}
      <p class="note">Barra de color: lo realizado. Línea gris: lo planificado.${measured&&below?` Además, ${fmt(below)} por debajo de L1.`:''}</p>
    </div>
    ${P.counts.length?`<div class="sectionhead"><h2>Pulso contado</h2></div>
    <div class="card"><div class="scroll"><table><thead><tr><th>Minuto</th><th>Objetivo</th><th>/10″</th><th>ppm</th><th>Estado</th></tr></thead><tbody>
      ${P.counts.map(c=>`<tr><td class="num">${fmt(c.t)}</td><td>${c.target}</td><td class="num">${c.v}</td><td class="num">${c.v*6}</td><td class="st-${c.st}">${c.st==='ok'?'En zona':c.st==='hi'?'Por encima':'Por debajo'}</td></tr>`).join('')}
    </tbody></table></div></div>`:''}
  </div>`;
  $('#sClose').onclick=()=>{P=null;closeOverlay();tab='lib';document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab==='lib'));render()};
}

render();
</script>
